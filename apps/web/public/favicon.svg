  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="30" r="18" fill="#2DD4BF" fill-opacity="0.12" filter="blur(8px)"/>
  
  <!-- Interlocking Peaks Wireframe (Singgah Emblem) -->
